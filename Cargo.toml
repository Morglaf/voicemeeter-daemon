[package]
name = "voicemeeter-controller"
version = "0.1.0"
edition = "2021"
description = "Daemon léger pour contrôler Voicemeeter via touches multimédia"

[dependencies]
voicemeeter = "0.4"
global-hotkey = "0.8"
tray-icon = "0.24"
winit = "0.30"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
wgpu = "23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "2"
ico = "0.5"
hidapi = "2"
regex = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
pollster = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
