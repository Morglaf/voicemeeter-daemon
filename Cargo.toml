[package]
name = "voicemeeter-controller"
version = "0.1.0"
edition = "2021"
description = "Daemon léger pour contrôler Voicemeeter via touches multimédia"

[dependencies]
voicemeeter = "0.4"
global-hotkey = "0.8"
tray-icon = "0.24"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "2"
ico = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
